[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomass-heat-scenarios"
version = "0.1.0"
description = "Industrial scenario screening for biomass gasification process heat: temperature, load, fuel quality and LCOH rank versus natural gas. Lives in the biomass-process-heat umbrella repo under scenarios/; there is no separate repository."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DataWithSyed" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "biomass-heat-plant-model @ git+https://github.com/DataWithSyed/biomass-heat-plant-model.git",
  "biomass-heat-lcoh @ git+https://github.com/DataWithSyed/biomass-heat-lcoh.git",
]
keywords = ["biomass", "process heat", "scenarios", "LCOH", "gasification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/DataWithSyed/biomass-process-heat"
Project = "https://github.com/DataWithSyed/biomass-process-heat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
